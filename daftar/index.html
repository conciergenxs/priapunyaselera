<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daftar — Pria Punya Selera</title>
  <meta name="description" content="Gabung jadi member Pria Punya Selera dan mulai kumpulin poin.">
  <meta name="theme-color" content="#0b0a09">
  <link rel="icon" href="/assets/home/favicon/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="/assets/home/favicon/favicon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/assets/home/favicon/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400..800&display=swap">

  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/pages.css">
  <script>document.documentElement.classList.add("js");</script>
  <meta name="pps-auth" content="guest">
  <script src="/js/auth-boot.js"></script>
  <script src="/js/app.js" type="module"></script>
</head>
<body>
  <main id="main" data-auth-page>
    <!-- Register. Prototype: any input signs in (js/auth.js); there is no account service yet. -->
    <section class="auth section--satin theme-dark" aria-labelledby="auth-title">
      <div class="container">
        <a class="auth__logo" href="/">
          <img src="/assets/home/logo.png" alt="Pria Punya Selera — Beranda" width="404" height="304">
        </a>
        <div class="auth__card surface panel">
          <h1 class="auth__title" id="auth-title">
            <span class="line">Masuki</span>
            <span class="line text-accent">Dunia Pria Punya Selera.</span>
          </h1>
          <p class="auth__lead">Bikin akun buat kumpulin poin dari event dan artikel, lalu tukar dengan hadiah pilihan.</p>
          <p class="auth__notice" role="status" data-auth-reason hidden></p>

          <form class="form" data-auth-form="register" novalidate>
              <div class="field">
                <label class="field__label" for="username">Username</label>
                <input class="field__input" id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="20" required aria-describedby="username-error">
                <p class="field__error" id="username-error" data-error-for="username"></p>
              </div>
              <div class="field">
                <label class="field__label" for="phone">Nomor WhatsApp</label>
                <input class="field__input" id="phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" required aria-describedby="phone-hint phone-error">
                <p class="field__hint" id="phone-hint">Contoh: 0812 3456 7890.</p>
                <p class="field__error" id="phone-error" data-error-for="phone"></p>
              </div>
              <div class="field">
                <label class="field__label" for="password">Password</label>
                <div class="field__control">
                  <input class="field__input" id="password" name="password" type="password" autocomplete="new-password" required aria-describedby="password-error">
                  <button class="field__toggle" type="button" aria-controls="password" aria-pressed="false" aria-label="Tampilkan password" data-password-toggle><svg class="field__toggle-show" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/></svg><svg class="field__toggle-hide" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.6 5.6A10 10 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a17 17 0 0 1-3 3.8M6.4 6.9A17 17 0 0 0 2.5 12S6 18.5 12 18.5a9.6 9.6 0 0 0 4.4-1.1M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button>
                </div>
                <p class="field__error" id="password-error" data-error-for="password"></p>
              </div>
            <div class="auth__actions">
              <button class="btn btn--primary" type="submit">Daftar</button>
            </div>
          </form>

          <p class="auth__switch">Sudah punya akun? <a class="text-link" href="/masuk/" data-auth-switch>Masuk</a></p>
        </div>
      </div>
    </section>
  </main>

</body>
</html>
